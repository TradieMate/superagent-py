services:
  - type: web
    name: superagent-sdk-demo
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 10000
      - key: SUPERAGENT_API_TOKEN
        sync: false  # This will need to be set manually in Render dashboard
      - key: SUPERAGENT_BASE_URL
        value: https://api.beta.superagent.sh
    healthCheckPath: /health